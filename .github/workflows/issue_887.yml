name: Reproduce issue

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:


jobs:
  reproduce_issue:
    strategy:
      fail-fast: false
      matrix:
        python-version: [
          "3.11",
        ]
        os: [
          "ubuntu-24.04",
          # "windows-latest",
          # "macos-latest",
        ]
        local_broker: [
          "true",
        ]          

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - uses: actions/checkout@v6

    - name: Start Mosquitto
      if: ${{ matrix.local_broker == 'true' }} and ${{ matrix.os == 'ubuntu-24.04' }}
      uses: namoshek/mosquitto-github-action@v1
      with:
        version: '1.6'
        ports: '1883:1883 8080:8080'
        config: ${{ github.workspace }}/repro/mosquitto.conf

    # - name: Run Mosquitto locally
    #   if: ${{ matrix.local_broker == 'true' }}
    #   shell: bash
    #   run: |
    #     mosquitto -v -c repro/mosquitto.conf &
    #     echo "MOSQUITTO_PID=$!" >> $GITHUB_ENV
    #     sleep 4  # give server time to start

    - name: Install Paho.MQTT
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install paho-mqtt==2.1.0

    - name: Show Python version.
      shell: bash
      run: |
        python --version

    - name: Run reproduction client script.
      shell: bash
      run: python repro/ex.py ${{ matrix.local_broker }}

    # - name: Stop Mosquitto
    #   if: ${{ matrix.local_broker == 'true' }}
    #   shell: bash
    #   run: |
    #     echo Killing Mosquitto process ID: ${{ env.MOSQUITTO_PID }}
    #     kill ${{ env.MOSQUITTO_PID }}